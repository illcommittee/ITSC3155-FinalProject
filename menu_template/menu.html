<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu | Inspector Gadget's Restaurant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav>
    <div class="navbar">
      <h2 class="logo">Inspector Gadget's Restaurant</h2>

      <ul class="nav-links">
        <li><a href="../menu_template/menu.html">Menu</a></li>
        <li><a href="../group_bio_template/index.html">About</a></li>
        <li><a href="../orders_template/orders.html">Orders</a></li>
        <li><a href="../login_template/login.html">Login/Signup</a></li>
        <li id="staff-nav-item" style="display:none"><a href="../staff_template/staff.html">Staff</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section id="menu-section">
      <h2>Menu</h2>
      <div id="category-tabs"></div>
      <div id="menu-grid"></div>
      <p id="menu-message"></p>
    </section>

    <section id="order-display">
      <h2>Current Order</h2>
      <ul id="order-list"></ul>
      <p id="order-total">Total: $0.00</p>
      <button id="checkout-btn">Checkout</button>
    </section>

    <section id="checkout-section" class="hidden">
      <h2>Checkout</h2>

      <label for="card-name">Customer Name</label>
      <input type="text" id="card-name" placeholder="Enter your name" required />

      <label>Order Type</label>
      <div id="order-type">
        <label><input type="radio" name="type" value="takeout" checked /> Takeout</label>
        <label><input type="radio" name="type" value="delivery" /> Delivery</label>
      </div>

      <label for="payment-type">Payment Type</label>
      <select id="payment-type">
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
        <option value="PayPal">PayPal</option>
      </select>

      <label for="promo">Promo Code</label>
      <input type="text" id="promo" placeholder="Enter code, e.g. SAVE10" />
      <button id="apply-promo" type="button">Apply</button>
      <p id="promo-msg"></p>

      <p id="checkout-total"></p>
      <button id="pay-btn" type="button">Pay & Place Order</button>
      <p id="order-status"></p>
    </section>
  </main>

  <dialog id="review-modal">
    <h3 id="review-modal-title">Write a Review</h3>
    <div id="star-selector">
      <button class="star-btn" data-star="1">★</button>
      <button class="star-btn" data-star="2">★</button>
      <button class="star-btn" data-star="3">★</button>
      <button class="star-btn" data-star="4">★</button>
      <button class="star-btn" data-star="5">★</button>
    </div>
    <textarea id="review-text" placeholder="Share your thoughts about this dish..." rows="4"></textarea>
    <div class="modal-actions">
      <button id="review-submit-btn" type="button">Submit Review</button>
      <button id="review-cancel-btn" type="button" class="btn-secondary">Cancel</button>
    </div>
    <p id="review-msg"></p>
  </dialog>

  <dialog id="view-reviews-modal">
    <h3 id="view-reviews-title">Reviews</h3>
    <p id="reviews-loading"></p>
    <div id="reviews-list"></div>
    <div class="modal-actions">
      <button id="view-reviews-close-btn" type="button" class="btn-secondary">Close</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
