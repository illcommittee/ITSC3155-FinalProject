<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="img/favicon48x48.png">
  <link rel="stylesheet" href="styles.css">

<body>
  <!-- Navbar -->
  <nav>
    <div class="navbar">
      <h2 class="logo">Inspector Gadget's Restaurant</h2>

      <ul class="nav-links">
        <a href="../menu_template/menu.html">Menu</a>

        <a href="../orders_template/orders.html">Orders</a>

    <div class="card">

        <div id="bio2" class="bio">
            <p>Ingredients: apples, sardines, pickles, beets</p>
        </div>
    </div>

  <!-- Displays All Current Orders -->

    <div class="card">
        <h2>Order Details</h2>
        <img src="../group_bio_template/img/avatar-jeevan.jpg" alt="food photo" class="avatar"/>
        <button onclick="toggleBio('bio3'); allOrders()">Show All Orders</button>
        <div id="bio3" class="bio">
            <p id="all-orders"></p>
        </div>
    </div>
  </div>

<script src="index.js"></script> <!-- Link to external JavaScript file -->
