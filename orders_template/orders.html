<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders — Inspector Gadget's Restaurant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav>
    <div class="navbar">
      <h2 class="logo">Inspector Gadget's Restaurant</h2>
      <ul class="nav-links">
        <a href="../menu_template/menu.html">Menu</a>
        <a href="../orders_template/orders.html">My Orders</a>
        <a href="../group_bio_template/index.html">About</a>
        <a href="../staff_template/staff.html">Staff</a>
        <a href="../login_template/login.html" id="auth-link">Login/Signup</a>
      </ul>
    </div>
  </nav>

  <main>

    <!-- Track by tracking number -->
    <section>
      <h2>Track an Order</h2>
      <div class="track-row">
        <input type="text" id="track-input" placeholder="Enter tracking number (e.g. TRK-ALICE001)" />
        <button id="track-btn">Track</button>
      </div>
      <div id="track-result" class="hidden"></div>
    </section>

    <!-- Customer's own orders (if logged in) -->
    <section id="my-orders-section">
      <h2>My Order History</h2>
      <div id="my-orders-list"><p class="muted">Log in to see your order history.</p></div>
    </section>

  </main>

  <script src="orders.js"></script>
</body>
</html>
