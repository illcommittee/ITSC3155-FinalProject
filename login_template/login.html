<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="icon" type="image/png" href="img/favicon48x48.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="navbar">
      <h2 class="logo">Inspector Gadget's Restaurant</h2>

      <ul class="nav-links">
        <a href="../menu_template/menu.html">Menu</a>
        <a href="../cart_template/cart.html">Cart</a>
        <a href="../group_bio_template\index.html">About</a>
        <a href="../login_template/login.html">Login/Signup</a>
      </ul>
    </div>
  </nav>

  <h1>Customer Account</h1>

  <section>
    <h2>Create Account</h2>

    <form id="signup-form">

      <input type="text" id="customer-name" placeholder="Full Name" required>

      <input type="email" id="signup-email" placeholder="Email" required>

      <input type="number" id="phone-num" placeholder="Phone Number" required>

      <input type="text" id="address" placeholder="Address" required>

      <button type="submit">Create Account</button>
    </form>
  </section>

  <hr>

  <section>
    <h2>Login</h2>

    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>

      <button type="submit">Login</button>
    </form>
  </section>

  <p id="message"></p>

  <script src="script.js"></script>
  
</body>
</html>
