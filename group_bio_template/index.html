<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h2>Menu</h2>
  <div id="menu"></div>

  <h2>Order</h2>
  <ul id="order-list"></ul>
  <p id="total">Total: $0.00</p>

  <h2>Checkout</h2>
  <label><input type="radio" name="type" value="takeout" checked> Takeout</label>
  <label><input type="radio" name="type" value="delivery"> Delivery</label>
  <br>
  <input type="text" id="promo" placeholder="Promo code" />
  <br>
  <button onclick="placeOrder()">Pay & Submit</button>
  <p id="msg"></p>

  <script src="script.js"></script>
</body>
</html>
